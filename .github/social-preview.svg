<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Social-Vorschau für GitHub (Settings → General → Social preview), 1280×640.
       Gerendert als social-preview.png; Schrift Inter (OFL), sonst Systemschrift. -->
  <defs>
    <radialGradient id="glut" cx="285" cy="320" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C85A12" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C85A12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="512" y1="512" x2="700" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A4480A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#C85A12" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#15181F"/>
  <rect width="1280" height="640" fill="url(#glut)"/>

  <!-- Radar, wie .github/icon.svg -->
  <g transform="translate(80 115) scale(0.4)">
    <rect width="1024" height="1024" rx="224" fill="#1B1F29" stroke="#F3F1EC" stroke-opacity="0.10" stroke-width="5"/>
    <g fill="none" stroke="#F3F1EC" stroke-opacity="0.28" stroke-width="16">
      <circle cx="512" cy="512" r="340"/>
      <circle cx="512" cy="512" r="230"/>
      <circle cx="512" cy="512" r="120"/>
    </g>
    <path d="M512 512 L512 172 A340 340 0 0 1 806.4 342 Z" fill="url(#sweep)"/>
    <line x1="512" y1="512" x2="806.4" y2="342" stroke="#F08A3C" stroke-width="16" stroke-linecap="round"/>
    <rect x="604" y="284" width="80" height="80" rx="10" fill="#F08A3C" transform="rotate(45 644 324)"/>
    <circle cx="396" cy="832" r="46" fill="#F3F1EC"/>
    <circle cx="711" cy="627" r="38" fill="#1B1F29" stroke="#F3F1EC" stroke-width="16"/>
    <circle cx="399" cy="471" r="20" fill="#F3F1EC" fill-opacity="0.55"/>
    <circle cx="512" cy="512" r="24" fill="#F3F1EC"/>
  </g>

  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#F3F1EC">
    <text x="560" y="176" font-size="21" font-weight="600" letter-spacing="3.5" fill="#F08A3C">PLUGIN FÜR CLAUDE CODE</text>
    <text x="556" y="262" font-size="82" font-weight="800" letter-spacing="-2">Sitzungsradar</text>
    <text x="560" y="332" font-size="46" font-weight="600" letter-spacing="-0.5">Alle Claude-Sitzungen</text>
    <text x="560" y="386" font-size="46" font-weight="600" letter-spacing="-0.5" fill="#F08A3C">auf einen Blick</text>
    <text x="560" y="430" font-size="22" font-weight="400" fill-opacity="0.62">All your Claude Code sessions at a glance</text>

    <!-- Die vier Zeichen -->
    <g font-size="22" font-weight="500">
      <rect x="563" y="474" width="15" height="15" rx="2" fill="#F08A3C" transform="rotate(45 570.5 481.5)"/>
      <text x="590" y="489">braucht dich</text>
      <circle cx="760" cy="481.5" r="8.5" fill="#F3F1EC"/>
      <text x="777" y="489">arbeitet</text>
      <circle cx="896" cy="481.5" r="7.5" fill="none" stroke="#F3F1EC" stroke-width="3"/>
      <text x="913" y="489">wartet</text>
      <circle cx="1014" cy="481.5" r="4.5" fill="#F3F1EC" fill-opacity="0.55"/>
      <text x="1028" y="489" fill-opacity="0.62">ruhig</text>
    </g>

    <line x1="80" y1="560" x2="1200" y2="560" stroke="#F3F1EC" stroke-opacity="0.10" stroke-width="1.5"/>
    <text x="80" y="598" font-size="21" font-weight="500">github.com/sdaum1909/sitzungsradar</text>
    <text x="1200" y="598" font-size="21" font-weight="400" text-anchor="end" fill-opacity="0.62">Ohne Kosten · MIT-Lizenz · läuft nur auf deinem Rechner</text>
  </g>
</svg>
